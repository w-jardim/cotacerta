# Configuração Nginx para cotacerta.gardenwjs.tech (Web)
#
# Este arquivo deve ser colocado em:
# /etc/nginx/sites-available/cotacerta.gardenwjs.tech
#
# E depois ativado com:
# sudo ln -s /etc/nginx/sites-available/cotacerta.gardenwjs.tech /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name cotacerta.gardenwjs.tech;

    # Logs
    access_log /var/log/nginx/cotacerta-web-access.log;
    error_log /var/log/nginx/cotacerta-web-error.log;

    # Proxy para container Web
    location / {
        proxy_pass http://127.0.0.1:3411;
        proxy_http_version 1.1;

        # Headers de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Após configurar SSL com Certbot, o Certbot irá adicionar automaticamente
# o bloco server para HTTPS (porta 443) neste arquivo.
