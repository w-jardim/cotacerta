services:
  postgres:
    image: postgres:16-alpine
    container_name: cotacerta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cotacerta
      POSTGRES_USER: cotacerta
      POSTGRES_PASSWORD: cotacerta_dev_password
    ports:
      - "127.0.0.1:3341:5432"
    volumes:
      - cotacerta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotacerta -d cotacerta"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cotacerta-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cotacerta-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3401
      DATABASE_URL: postgresql://cotacerta:cotacerta_dev_password@postgres:5432/cotacerta?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_in_real_environment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "127.0.0.1:3401:3401"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cotacerta-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3401/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cotacerta-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3411:80"
    networks:
      - cotacerta-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  cotacerta_postgres_data:

networks:
  cotacerta-network:
    driver: bridge
